name: "Build nuget package"
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.MD'
      - 'LICENSE'
jobs:
  BuildTestAndPush:
    name: "Build test and push"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
      - uses: actions/checkout@v7
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Use CLI
        uses: scaleway/action-scw@v0
        with:
          save-config: true
          export-config: true
          version: v2.60.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      - name: "Output config info as json"
        run: scw config info --output json
      - name: "Restore"
        run: dotnet restore ./src/LodeKennes.Extensions.Scaleway.SecretManager/
      - name: "Build"
        run: dotnet build --no-restore -c Release ./src/LodeKennes.Extensions.Scaleway.SecretManager/
      - name: "Run tests"
        run: dotnet test -c Release ./test/LodeKennes.Extensions.Scaleway.Tests/
      - name: "Create nuget package"
        run: dotnet pack -o ./nuget-package -c Release ./src/LodeKennes.Extensions.Scaleway.SecretManager/
        
      - name: Extract version
        id: vars
        run: echo "version=$(grep '<Version>' Directory.Build.props | sed -E 's/.*<Version>(.*)<\/Version>.*/\1/')" >> "$GITHUB_OUTPUT"

      - name: "Publish package"
        run: dotnet nuget push ./nuget-package/*.nupkg --skip-duplicate --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: "Create GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" ./nuget-package/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "Release $tag" \
            --generate-notes
